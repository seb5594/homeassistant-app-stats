name: Build and deploy Observatory
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore own history
        shell: bash
        run: |
          mkdir -p .cache
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch origin refs/heads/data:refs/remotes/origin/data
            git show FETCH_HEAD:history.json.gz > .cache/history.json.gz
          fi
      - name: Fetch and validate official analytics
        run: npm run data
      - run: npm run build
      - name: Persist compressed history on data branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          blob=$(git hash-object -w .cache/history.json.gz)
          tree=$(printf '100644 blob %s\thistory.json.gz\n' "$blob" | git mktree)
          parent_args=()
          if git rev-parse --verify refs/remotes/origin/data > /dev/null 2>&1; then
            parent_args=(-p "$(git rev-parse refs/remotes/origin/data)")
          fi
          commit=$(printf 'Daily Home Assistant analytics snapshot\n' | git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit:refs/heads/data"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
